name: CI - Lint, Test & Build Validation

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Schema & Build Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
      JWT_SECRET: "ci-validation-secret-key-32-chars-long"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Workspace (Frontend & Backend)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Build Application (Frontend & Backend)
        run: npm run build

  docker-build-check:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [validate-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cashflow-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: cashflow-frontend:test
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
