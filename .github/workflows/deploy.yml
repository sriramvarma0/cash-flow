name: Deploy to EC2

on:
  push:
    branches:
      - master
      - main

permissions:
  id-token: write
  contents: read

jobs:
  pre-deploy-check:
    name: Pre-deployment Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Workspace
        run: npm run lint

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

  deploy:
    name: Trigger EC2 Production Deployment
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Deploy Command via SSM
        run: |
          echo "Triggering SSM Run Command for Deploy..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="['runuser -l ubuntu -c \"/opt/cashflow/scripts/deploy.sh\"']" \
            --query "Command.CommandId" \
            --output text)
            
          echo "SSM Command triggered: $COMMAND_ID"
          
          # Wait and poll command status to verify it succeeded
          STATUS="Pending"
          while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)
            echo "Current Status: $STATUS"
          done
          
          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command execution failed! Status: $STATUS"
            # Get execution logs
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
          echo "SSM command execution succeeded!"
